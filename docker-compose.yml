services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lhl76
      POSTGRES_USER: lhl76
      POSTGRES_PASSWORD: lhl76
    # Local development only. Production must not publish the database port.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  postgres-data:
