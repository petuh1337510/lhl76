name: Check VK video integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read video metadata from VK using the runtime configuration
        env:
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SERVER_PRIVATE_KEY}" > ~/.ssh/lhl76-deploy
          chmod 600 ~/.ssh/lhl76-deploy
          cp docs/production-known-hosts ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/lhl76-deploy root@191.217.231.118 \
            'docker compose --env-file /opt/lhl76/.env -f /opt/lhl76/docker-compose.production.yml exec -T app node --input-type=module' < scripts/check-vk-video.mjs
