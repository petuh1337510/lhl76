name: Prepare production host

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lhl76-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SERVER_PRIVATE_KEY}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SERVER_PRIVATE_KEY}" > ~/.ssh/lhl76-deploy
          chmod 600 ~/.ssh/lhl76-deploy
          cp docs/production-known-hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Install Docker, Nginx and IP certificate
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME }}
          SERVER_APP_PATH: ${{ vars.SERVER_APP_PATH }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
        run: |
          set -euo pipefail
          test "${SERVER_HOST}" = 191.217.231.118
          test "${SERVER_APP_PATH}" = /opt/lhl76
          ssh -i ~/.ssh/lhl76-deploy -p "${SERVER_PORT}" "${SERVER_USERNAME}@${SERVER_HOST}" \
            "mkdir -p '${SERVER_APP_PATH}'"
          scp -i ~/.ssh/lhl76-deploy -P "${SERVER_PORT}" scripts/prepare-production-host.sh \
            "${SERVER_USERNAME}@${SERVER_HOST}:${SERVER_APP_PATH}/prepare-production-host.sh"
          ssh -i ~/.ssh/lhl76-deploy -p "${SERVER_PORT}" "${SERVER_USERNAME}@${SERVER_HOST}" \
            "chmod +x '${SERVER_APP_PATH}/prepare-production-host.sh'; '${SERVER_APP_PATH}/prepare-production-host.sh' '${SERVER_HOST}' '${APP_PORT}' '${SERVER_APP_PATH}'"
