name: Grant temporary LHL-76 transfer key once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-transfer-key-once.yml

permissions:
  contents: read

jobs:
  grant:
    if: github.actor == 'petuh1337510' && github.event.head_commit.message == 'Grant temporary LHL-76 transfer key'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install expiring transfer key
        env:
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SERVER_PRIVATE_KEY}" > ~/.ssh/lhl76-grant
          chmod 600 ~/.ssh/lhl76-grant
          cp docs/production-known-hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' 'expiry-time="20261104" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB0Qz95VXmEmxicHbgmGGQOAcJVj2fRjFnglRAGrkabu lhl76-prod-transfer-20261103' |
            ssh -i ~/.ssh/lhl76-grant -o BatchMode=yes root@191.217.231.118 \
              'set -eu; umask 077; mkdir -p /root/.ssh; touch /root/.ssh/authorized_keys; IFS= read -r key; grep -Fxq "$key" /root/.ssh/authorized_keys || printf "%s\n" "$key" >> /root/.ssh/authorized_keys; chmod 700 /root/.ssh; chmod 600 /root/.ssh/authorized_keys'
