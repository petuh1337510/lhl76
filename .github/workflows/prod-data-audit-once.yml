name: Audit LHL-76 production data once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-data-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.actor == 'petuh1337510' && github.event.head_commit.message == 'Audit production data before local database deployment'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read-only production inventory
        env:
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SERVER_PRIVATE_KEY}" > ~/.ssh/lhl76-audit
          chmod 600 ~/.ssh/lhl76-audit
          cp docs/production-known-hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/lhl76-audit -o BatchMode=yes root@191.217.231.118 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/lhl76
          environment=/opt/lhl76/.env
          compose=/opt/lhl76/docker-compose.production.yml
          test -s "${environment}" && test -s "${compose}"
          db_id="$(docker compose --env-file "${environment}" -f "${compose}" ps -q db)"
          test -n "${db_id}"
          printf 'critical_counts='
          printf '%s\n' 'SELECT (SELECT count(*) FROM "User"),(SELECT count(*) FROM "Player"),(SELECT count(*) FROM "Match"),(SELECT count(*) FROM "Goal"),(SELECT count(*) FROM "Penalty"),(SELECT count(*) FROM "PlayerStatistic"),(SELECT count(*) FROM "TeamStatistic");' |
            docker compose --env-file "${environment}" -f "${compose}" exec -T db sh -ec 'exec psql -XAt -F, -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          printf 'table_count='
          printf '%s\n' "SELECT count(*) FROM pg_tables WHERE schemaname='public';" |
            docker compose --env-file "${environment}" -f "${compose}" exec -T db sh -ec 'exec psql -XAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          printf 'database_bytes='
          printf '%s\n' 'SELECT pg_database_size(current_database());' |
            docker compose --env-file "${environment}" -f "${compose}" exec -T db sh -ec 'exec psql -XAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          for directory in uploads legacy-media documents images-optimized; do
            test -d "/opt/lhl76/public-files/${directory}"
            find "/opt/lhl76/public-files/${directory}" -type f -printf '%s\n' |
              awk -v label="${directory}" '{count++; bytes += $1} END {printf "%s files=%d bytes=%.0f\n", label, count, bytes}'
          done
          printf 'disk_available_bytes='
          df -B1 --output=avail / | tail -n 1 | tr -d ' '
          REMOTE
